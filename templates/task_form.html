{% extends "layout.html" %}

{% block title %}{{ title_page }} — StudyFlow{% endblock %}

{% block content %}

<div class="tk-page">

  <header class="tk-header">
    <div>
      <h1>{{ title_page }}</h1>
    </div>
  </header>

  <form action="{{ form_action }}" method="post" class="tk-form">

    <div class="form-group">
      <label for="title">Titre</label>
      <input type="text" id="title" name="title" value="{{ task.title if task else '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4">{{ task.description if task and task.description else '' }}</textarea>
    </div>

    <div class="form-group">
      <label for="subject_id">Matière</label>
      <select id="subject_id" name="subject_id">
        <option value="">Aucune matière</option>
        {% for subject in subjects %}
          <option value="{{ subject.id }}" {% if task and task.subject_id == subject.id %}selected{% endif %}>
            {{ subject.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="due_date">Date limite</label>
      <input type="date" id="due_date" name="due_date" value="{{ task.due_date if task and task.due_date else '' }}">
    </div>

    <div class="form-group">
      <label for="priority">Priorité</label>
      <select id="priority" name="priority">
        <option value="low" {% if task and task.priority == "low" %}selected{% endif %}>Basse</option>
        <option value="medium" {% if not task or task.priority == "medium" %}selected{% endif %}>Moyenne</option>
        <option value="high" {% if task and task.priority == "high" %}selected{% endif %}>Haute</option>
      </select>
    </div>

    <div class="form-group">
      <label for="status">Statut</label>
      <select id="status" name="status">
        <option value="todo" {% if not task or task.status == "todo" %}selected{% endif %}>À faire</option>
        <option value="doing" {% if task and task.status == "doing" %}selected{% endif %}>En cours</option>
        <option value="done" {% if task and task.status == "done" %}selected{% endif %}>Terminée</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="tk-btn">Enregistrer</button>
      <a href="{{ url_for('tasks') }}" class="tk-cancel">Annuler</a>
    </div>

  </form>

</div>

{% endblock %}
